name: Build Game Release & Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build static game bundle
        run: npm run build

      - name: Package game-portal-release.zip
        working-directory: dist
        run: zip -r ../game-portal-release.zip .

      - name: Upload game-portal-release.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-portal-release
          path: game-portal-release.zip
          retention-days: 30

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to CrazyGames (if CRAZYGAMES_TOKEN is set)
        if: ${{ secrets.CRAZYGAMES_TOKEN != '' }}
        env:
          CRAZYGAMES_TOKEN: ${{ secrets.CRAZYGAMES_TOKEN }}
        run: |
          npx @crazygames/sdk-cli upload --token "$CRAZYGAMES_TOKEN" --file game-portal-release.zip

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
